name: Build Nao AI Video Upscaler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official source
        run: |
          set -e

          rm -rf /tmp/nao-upscaler
          mkdir -p /tmp/nao-upscaler
          cd /tmp/nao-upscaler

          npm pack github:sb2702/free-ai-video-upscaler#main

          mkdir source

          tar -xzf free-video-upscaler-*.tgz \
            -C source \
            --strip-components=1

          echo "=== SOURCE DOWNLOADED ==="
          find source -maxdepth 2 -type f | sort

      - name: Inspect source
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          find . -maxdepth 3 -type f \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            | sort

          echo
          echo "================================"
          echo "WEBPACK FILES"
          echo "================================"

          find . -type f \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            | grep -Ei 'webpack|config' || true

          echo
          echo "================================"
          echo "SEARCH LEGACY PATH"
          echo "================================"

          grep -R -n \
            -E '/tmp/nao-upscaler|source/src|src/\*\.js' \
            . \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            || true

      - name: Fix webpack configuration
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          replacements = {
              "/tmp/nao-upscaler/source/src/*.js": "src/*.js",
              "/tmp/nao-upscaler/source/src/": "src/",
              "/tmp/nao-upscaler/source/": "./",
          }

          changed = []

          allowed = {
              ".js",
              ".cjs",
              ".mjs",
              ".json",
              ".ts",
              ".yml",
              ".yaml"
          }

          for file in root.rglob("*"):
              if not file.is_file():
                  continue

              if "node_modules" in file.parts:
                  continue

              if ".git" in file.parts:
                  continue

              if file.suffix not in allowed:
                  continue

              try:
                  text = file.read_text()
              except Exception:
                  continue

              original = text

              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  file.write_text(text)
                  changed.append(str(file))

          print("=== FILES FIXED ===")

          if changed:
              for file in changed:
                  print(file)
          else:
              print("No legacy paths found.")
          PY

          echo
          echo "================================"
          echo "VERIFY LEGACY PATH"
          echo "================================"

          if grep -R -n \
            -E '/tmp/nao-upscaler/source/src|/tmp/nao-upscaler/source/' \
            . \
            --exclude-dir=node_modules \
            --exclude-dir=.git; then
            echo "ERROR: Legacy path still exists."
            exit 1
          fi

          echo "Legacy path not found."

      - name: Install dependencies
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e
          npm install

      - name: Show build configuration
        working-directory: /tmp/nao-upscaler/source
        run: |
          echo "================================"
          echo "PACKAGE.JSON"
          echo "================================"
          cat package.json

          echo
          echo "================================"
          echo "WEBPACK CONFIG"
          echo "================================"

          for file in webpack.config.js webpack.config.cjs webpack.config.mjs; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
              echo
            fi
          done

      - name: Build upscaler
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e
          npm run build

      - name: Check build
        run: |
          set -e

          DIST="/tmp/nao-upscaler/source/dist"

          echo "================================"
          echo "BUILD RESULT"
          echo "================================"

          if [ ! -d "$DIST" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "dist directory found."
          echo

          find "$DIST" -type f -printf '%P\n' | sort

          echo
          echo "================================"
          echo "BUILD SIZE"
          echo "================================"

          du -sh "$DIST"

      - name: Prepare artifact
        run: |
          set -e

          rm -rf nao-upscaler
          mkdir -p nao-upscaler

          cp -R \
            /tmp/nao-upscaler/source/dist/. \
            nao-upscaler/

          echo "================================"
          echo "ARTIFACT CONTENT"
          echo "================================"

          find nao-upscaler -type f -printf '%P\n' | sort

          echo
          echo "================================"
          echo "ARTIFACT SIZE"
          echo "================================"

          du -sh nao-upscaler

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nao-ai-video-upscaler
          path: nao-upscaler
          if-no-files-found: error
          retention-days: 7
