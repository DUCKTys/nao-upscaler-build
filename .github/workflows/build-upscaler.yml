name: Build Nao AI Video Upscaler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official source
        run: |
          set -e

          mkdir -p /tmp/nao-upscaler
          cd /tmp/nao-upscaler

          npm pack github:sb2702/free-ai-video-upscaler#main

          mkdir source

          tar -xzf free-video-upscaler-*.tgz \
            -C source \
            --strip-components=1

      - name: Install dependencies
        working-directory: /tmp/nao-upscaler/source
        run: |
          npm install

      - name: Build upscaler
        working-directory: /tmp/nao-upscaler/source
        run: |
          npm run build

      - name: Check build
        run: |
          echo "=== BUILD RESULT ==="
          find /tmp/nao-upscaler/source/dist -maxdepth 3 -type f | sort

      - name: Prepare artifact
        run: |
          set -e

          rm -rf nao-upscaler
          mkdir -p nao-upscaler

          cp -R /tmp/nao-upscaler/source/dist/. nao-upscaler/

          echo "=== ARTIFACT ==="
          find nao-upscaler -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nao-ai-video-upscaler
          path: nao-upscaler
          if-no-files-found: error
          retention-days: 7
