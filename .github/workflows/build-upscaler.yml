name: Build Nao AI Video Upscaler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official source
        run: |
          mkdir -p /tmp/nao-upscaler
          cd /tmp/nao-upscaler
          npm pack github:sb2702/free-ai-video-upscaler#main
          mkdir source
          tar -xzf free-video-upscaler-*.tgz -C source --strip-components=1

      - name: Install dependencies
        working-directory: /tmp/nao-upscaler/source
        run: npm install

      - name: Build
        working-directory: /tmp/nao-upscaler/source
        run: npm run build

      - name: Prepare artifact
        run: |
          mkdir -p nao-upscaler
          cp -R /tmp/nao-upscaler/source/dist/. nao-upscaler/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nao-ai-video-upscaler
          path: nao-upscaler/
          retention-days: 7
