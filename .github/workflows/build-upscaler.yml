name: Build Nao AI Video Upscaler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official source
        run: |
          set -e

          rm -rf /tmp/nao-upscaler
          mkdir -p /tmp/nao-upscaler
          cd /tmp/nao-upscaler

          npm pack github:sb2702/free-ai-video-upscaler#main

          mkdir source

          tar -xzf free-video-upscaler-*.tgz \
            -C source \
            --strip-components=1

      - name: Inspect source
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e

          echo "=== PACKAGE ==="
          cat package.json

          echo
          echo "=== CONFIG FILES ==="

          find . -maxdepth 2 -type f \
            \( -name "webpack*" -o -name "*config*" \) \
            ! -path "./node_modules/*" \
            | sort

          echo
          echo "=== SEARCH *.js GLOB ==="

          grep -R -n \
            -E 'src/\*\.js|source/src|CopyWebpackPlugin|copy-webpack-plugin' \
            . \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            || true

      - name: Patch webpack config
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("webpack.config.js"),
              Path("webpack.config.cjs"),
              Path("webpack.config.mjs")
          ]

          for file in files:
              if not file.exists():
                  continue

              print(f"=== PATCHING {file} ===")

              text = file.read_text()

              original = text

              # Remove CopyWebpackPlugin entries that copy src/*.js.
              text = re.sub(
                  r'\{\s*from:\s*["\'](?:/tmp/nao-upscaler/source/)?src/\*\.js["\'][\s\S]*?\},?',
                  '',
                  text
              )

              # Remove direct legacy absolute paths.
              text = text.replace(
                  "/tmp/nao-upscaler/source/src/*.js",
                  "src/*.js"
              )

              if text != original:
                  file.write_text(text)
                  print("Configuration changed.")
              else:
                  print("No direct match found.")

          PY

          echo
          echo "=== CONFIG AFTER PATCH ==="

          for file in webpack.config.js webpack.config.cjs webpack.config.mjs; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
            fi
          done

      - name: Install dependencies
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e
          npm install

      - name: Verify webpack configuration
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e

          echo "=== FINAL SEARCH ==="

          if grep -R -n \
            "/tmp/nao-upscaler/source/src/*.js" \
            . \
            --exclude-dir=node_modules \
            --exclude-dir=.git; then
            echo "ERROR: Legacy glob still exists."
            exit 1
          fi

          echo "Legacy glob not found in source files."

      - name: Build upscaler
        working-directory: /tmp/nao-upscaler/source
        run: |
          set -e
          npm run build

      - name: Check build
        run: |
          set -e

          DIST="/tmp/nao-upscaler/source/dist"

          echo "=== BUILD RESULT ==="

          if [ ! -d "$DIST" ]; then
            echo "ERROR: dist directory does not exist."
            exit 1
          fi

          find "$DIST" -type f -printf '%P\n' | sort

          echo
          echo "=== SIZE ==="
          du -sh "$DIST"

      - name: Prepare artifact
        run: |
          set -e

          rm -rf nao-upscaler
          mkdir -p nao-upscaler

          cp -R \
            /tmp/nao-upscaler/source/dist/. \
            nao-upscaler/

          echo "=== ARTIFACT ==="

          find nao-upscaler -type f -printf '%P\n' | sort

          echo
          echo "=== ARTIFACT SIZE ==="
          du -sh nao-upscaler

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nao-ai-video-upscaler
          path: nao-upscaler
          if-no-files-found: error
          retention-days: 7
