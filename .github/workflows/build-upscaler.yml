name: Build Nao AI Video Upscaler
  working-directory: /tmp/nao-upscaler/source
  run: |
    # Perbaiki hardcoded path di webpack.config.js jika ada (mengganti nao-upcaler jadi nao-upscaler)
    sed -i 's/nao-upcaler/nao-upscaler/g' webpack.config.js || echo "Tidak ada perubahan"
    npm run build
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-upscaler.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nao
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Download official upscaler source
        run: |
          mkdir -p /tmp/nao-upscaler
          cd /tmp/nao-upscaler
          npm pack github:sb2702/free-ai-video-upscaler#main
          mkdir source
          tar -xzf free-video-upscaler-*.tgz -C source --strip-components=1

      - name: Install upscaler dependencies
        working-directory: /tmp/nao-upscaler/source
        run: npm install

      - name: Build upscaler
        working-directory: /tmp/nao-upscaler/source
        run: npm run build

      - name: Find build output
        run: |
          echo "=== BUILD DIRECTORY ==="
          find /tmp/nao-upscaler/source -maxdepth 2 -type d | sort

          echo "=== BUILD FILES ==="
          find /tmp/nao-upscaler/source -maxdepth 3 -type f | sort | head -200

      - name: Prepare Nao upscaler
        run: |
          rm -rf nao-upscaler-build
          mkdir -p nao-upscaler-build

          if [ -d "/tmp/nao-upscaler/source/dist" ]; then
            cp -R /tmp/nao-upscaler/source/dist/. nao-upscaler-build/
          elif [ -d "/tmp/nao-upscaler/source/build" ]; then
            cp -R /tmp/nao-upscaler/source/build/. nao-upscaler-build/
          else
            echo "Build output tidak ditemukan."
            exit 1
          fi

          echo "=== FINAL ARTIFACT ==="
          find nao-upscaler-build -type f | sort

      - name: Upload Nao Upscaler
        uses: actions/upload-artifact@v4
        with:
          name: nao-ai-video-upscaler
          path: nao-upscaler-build
          compression-level: 9
          if-no-files-found: error
          retention-days: 7
